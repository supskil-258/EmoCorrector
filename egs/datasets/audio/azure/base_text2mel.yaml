raw_data_dir: 'dataset/azure'
processed_data_dir: 'dataset/processed'
binary_data_dir: 'dataset/binary'
pre_align_cls: egs.datasets.audio.azure.pre_align.AzurePreAlign
audio_sample_rate: 16000
binarization_args:
  shuffle: true
binarizer_cls: data_gen.tts.base_binarizer_emotion.EmotionBinarizer
use_spk_id: true
test_num: 200
